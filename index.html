<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TikTok Tracker</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: "Meiryo UI", "Meiryo", sans-serif;
    }

    header {
      background: #d40000;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 12px;
    }

    main {
      width: min(100% - 24px, 700px);
      margin: 18px auto 50px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .video-title {
      margin-bottom: 16px;
      font-size: 15px;
      font-weight: bold;
      line-height: 1.6;
    }

    .main-count {
      padding: 15px 0 20px;
      border-bottom: 1px solid #ddd;
      text-align: center;
    }

    .main-count .label {
      font-size: 14px;
    }

    .main-count .number {
      display: block;
      margin-top: 5px;
      color: #d40000;
      font-size: 36px;
      font-weight: bold;
    }

    .difference {
      margin-top: 6px;
      font-size: 14px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      padding: 14px 8px;
      background: #f7f7f7;
      border-radius: 9px;
      text-align: center;
    }

    .stat-label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .stat-number {
      font-size: 20px;
      font-weight: bold;
    }

    .updated {
      margin-top: 15px;
      color: #666;
      font-size: 11px;
      line-height: 1.7;
      text-align: center;
    }

    .section-title {
      margin: 0 0 15px;
      padding-left: 8px;
      border-left: 5px solid #d40000;
      font-size: 17px;
    }

    .graph-wrap {
      position: relative;
      width: 100%;
      height: 300px;
    }

    .graph-note {
      margin-top: 12px;
      color: #777;
      font-size: 10px;
      line-height: 1.7;
      text-align: center;
    }

    .record {
      padding: 13px 0;
      border-bottom: 1px solid #ddd;
    }

    .record:last-child {
      border-bottom: none;
    }

    .record-date {
      margin-bottom: 6px;
      font-size: 12px;
      font-weight: bold;
    }

    .record-number {
      color: #d40000;
      font-size: 18px;
      font-weight: bold;
    }

    .record-diff {
      margin-top: 3px;
      font-size: 11px;
      font-weight: bold;
    }

    .record-stats {
      margin-top: 6px;
      color: #555;
      font-size: 11px;
      line-height: 1.7;
    }

    .no-record {
      color: #777;
      font-size: 12px;
      line-height: 1.8;
    }

    footer {
      padding: 20px;
      color: #666;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 20px;
      }

      .main-count .number {
        font-size: 32px;
      }

      .graph-wrap {
        height: 260px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>TikTok Tracker</h1>
  <p>3時間ごとに再生数・反応数を定点記録</p>
</header>

<main>

  <section class="card">

    <div class="video-title" id="videoTitle">
      TikTokデータを読み込んでいます...
    </div>

    <div class="main-count">
      <span class="label">再生数</span>

      <span class="number" id="views">
        ---
      </span>

      <div class="difference" id="viewsDiff">
        前回記録比：---
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <span class="stat-label">いいね</span>
        <span class="stat-number" id="likes">---</span>
      </div>

      <div class="stat">
        <span class="stat-label">コメント</span>
        <span class="stat-number" id="comments">---</span>
      </div>

      <div class="stat">
        <span class="stat-label">シェア</span>
        <span class="stat-number" id="shares">---</span>
      </div>

      <div class="stat">
        <span class="stat-label">保存</span>
        <span class="stat-number" id="saves">---</span>
      </div>

    </div>

    <div class="updated" id="updated">
      最新記録を読み込んでいます...
    </div>

  </section>


  <section class="card">

    <h2 class="section-title">
      DAY1〜DAY7 再生数推移
    </h2>

    <div class="graph-wrap">
      <canvas id="viewsChart"></canvas>
    </div>

    <div class="graph-note">
      3時間ごとの定点記録を表示します。<br>
      記録開始から7日間のデータが対象です。
    </div>

  </section>


  <section class="card">

    <h2 class="section-title">
      3時間ごとの定点記録
    </h2>

    <div id="history">
      <div class="no-record">
        記録を読み込んでいます...
      </div>
    </div>

  </section>

</main>


<footer>
  非公式ファンサイト<br>
  作成者：@mtkwk_info1126
</footer>


<script>

  let viewsChart = null;

  const formatNumber = (number) => {
    return Number(number || 0).toLocaleString("ja-JP");
  };


  const formatDifference = (number) => {

    const value = Number(number || 0);

    if (value > 0) {
      return "+" + formatNumber(value);
    }

    if (value < 0) {
      return "−" + formatNumber(Math.abs(value));
    }

    return "±0";
  };


  const formatDateTime = (dateString) => {

    if (!dateString) {
      return "---";
    }

    return new Date(dateString).toLocaleString("ja-JP", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  };


  function createGraph(records) {

    const graphRecords = [...records]
      .filter(record => record.recorded_at)
      .sort(
        (a, b) =>
          new Date(a.recorded_at) -
          new Date(b.recorded_at)
      );

    if (graphRecords.length === 0) {
      return;
    }

    const firstTime =
      new Date(graphRecords[0].recorded_at);

    const sevenDays =
      7 * 24 * 60 * 60 * 1000;

    const records7Days =
      graphRecords.filter(record => {

        const recordTime =
          new Date(record.recorded_at);

        return (
          recordTime - firstTime >= 0 &&
          recordTime - firstTime < sevenDays
        );
      });


    const labels =
      records7Days.map(record => {

        const recordTime =
          new Date(record.recorded_at);

        const hours =
          (recordTime - firstTime) /
          (1000 * 60 * 60);

        const day =
          Math.floor(hours / 24) + 1;

        const japanTime =
          recordTime.toLocaleTimeString(
            "ja-JP",
            {
              timeZone: "Asia/Tokyo",
              hour: "2-digit",
              minute: "2-digit"
            }
          );

        return `DAY${day} ${japanTime}`;
      });


    const views =
      records7Days.map(record =>
        Number(record.views || 0)
      );


    const context =
      document
        .getElementById("viewsChart")
        .getContext("2d");


    if (viewsChart) {
      viewsChart.destroy();
    }


    viewsChart =
      new Chart(context, {

        type: "line",

        data: {

          labels: labels,

          datasets: [
            {
              label: "再生数",
              data: views,
              borderWidth: 2,
              pointRadius: 2,
              pointHoverRadius: 5,
              tension: 0.25
            }
          ]
        },

        options: {

          responsive: true,

          maintainAspectRatio: false,

          interaction: {
            intersect: false,
            mode: "index"
          },

          plugins: {

            legend: {
              display: false
            },

            tooltip: {

              callbacks: {

                label: function(context) {

                  return (
                    "再生数 " +
                    formatNumber(context.raw) +
                    " 回"
                  );
                }
              }
            }
          },

          scales: {

            x: {

              ticks: {
                maxRotation: 0,
                autoSkip: true,
                maxTicksLimit: 8
              },

              grid: {
                display: false
              }
            },

            y: {

              ticks: {

                callback: function(value) {
                  return formatNumber(value);
                }
              }
            }
          }
        }
      });
  }


  async function loadData() {

    try {

      // Supabaseに保存済みの記録だけ取得
      // QuanticDataはここでは呼ばない
      const response =
        await fetch("/api/records");

      if (!response.ok) {
        throw new Error(
          "履歴データの取得に失敗しました"
        );
      }

      const result =
        await response.json();

      const allRecords =
        Array.isArray(result.data)
          ? result.data
          : [];


      if (allRecords.length === 0) {

        document.getElementById(
          "videoTitle"
        ).textContent =
          "まだ定点記録がありません。";

        document.getElementById(
          "updated"
        ).textContent =
          "最初の定点記録を待っています。";

        document.getElementById(
          "history"
        ).innerHTML = `
          <div class="no-record">
            まだ3時間ごとの記録がありません。
          </div>
        `;

        return;
      }


      // 一番新しい記録の動画を現在の動画として扱う
      const latestRecord =
        allRecords[0];

      const currentVideoId =
        latestRecord.video_id;


      // 現在の動画だけに絞る
      const records =
        allRecords.filter(
          record =>
            String(record.video_id) ===
            String(currentVideoId)
        );


      document.getElementById(
        "videoTitle"
      ).textContent =
        latestRecord.description ||
        "TikTok動画";


      document.getElementById(
        "views"
      ).textContent =
        formatNumber(latestRecord.views);


      document.getElementById(
        "likes"
      ).textContent =
        formatNumber(latestRecord.likes);


      document.getElementById(
        "comments"
      ).textContent =
        formatNumber(latestRecord.comments);


      document.getElementById(
        "shares"
      ).textContent =
        formatNumber(latestRecord.shares);


      document.getElementById(
        "saves"
      ).textContent =
        formatNumber(latestRecord.saves);


      if (records.length >= 2) {

        const difference =
          Number(records[0].views) -
          Number(records[1].views);

        document.getElementById(
          "viewsDiff"
        ).textContent =
          "前回記録比：" +
          formatDifference(difference);

      } else {

        document.getElementById(
          "viewsDiff"
        ).textContent =
          "前回記録比：記録開始前";
      }


      document.getElementById(
        "updated"
      ).textContent =
        "最新定点記録：" +
        formatDateTime(
          latestRecord.recorded_at
        );


      const historyElement =
        document.getElementById(
          "history"
        );


      historyElement.innerHTML =
        records.map(
          (record, index) => {

            let differenceText =
              "最初の記録";

            if (index < records.length - 1) {

              const difference =
                Number(record.views) -
                Number(
                  records[index + 1].views
                );

              differenceText =
                "前回比 " +
                formatDifference(difference);
            }


            const hour =
              record.snapshot_hour !== null &&
              record.snapshot_hour !== undefined
                ? String(
                    record.snapshot_hour
                  ).padStart(2, "0") +
                  ":00枠"
                : "";


            return `
              <div class="record">

                <div class="record-date">
                  ${record.snapshot_date}
                  ${hour}
                </div>

                <div class="record-number">
                  ${formatNumber(record.views)}
                  回
                </div>

                <div class="record-diff">
                  ${differenceText}
                </div>

                <div class="record-stats">
                  いいね
                  ${formatNumber(record.likes)}
                  　
                  コメント
                  ${formatNumber(record.comments)}
                  <br>

                  シェア
                  ${formatNumber(record.shares)}
                  　
                  保存
                  ${formatNumber(record.saves)}
                </div>

              </div>
            `;
          }
        ).join("");


      createGraph(records);

    } catch (error) {

      console.error(error);

      document.getElementById(
        "updated"
      ).textContent =
        "データを取得できませんでした。";

      document.getElementById(
        "history"
      ).innerHTML = `
        <div class="no-record">
          定点記録を取得できませんでした。
        </div>
      `;
    }
  }


  loadData();

</script>

</body>
</html>
