<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>TikTok Tracker</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f5f5;
      color: #111;
      font-family: "Meiryo UI", "Meiryo", sans-serif;
    }

    header {
      background: #d40000;
      color: white;
      padding: 18px 15px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 22px;
    }

    header p {
      margin: 6px 0 0;
      font-size: 12px;
    }

    main {
      width: min(100% - 24px, 650px);
      margin: 18px auto 50px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }

    .video-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.6;
      margin-bottom: 16px;
    }

    .main-count {
      text-align: center;
      padding: 15px 0 20px;
      border-bottom: 1px solid #ddd;
    }

    .main-count .label {
      font-size: 14px;
    }

    .main-count .number {
      display: block;
      margin-top: 5px;
      color: #d40000;
      font-size: 36px;
      font-weight: bold;
    }

    .difference {
      margin-top: 5px;
      font-size: 14px;
      font-weight: bold;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 15px;
    }

    .stat {
      background: #f7f7f7;
      border-radius: 9px;
      padding: 14px 8px;
      text-align: center;
    }

    .stat-label {
      display: block;
      margin-bottom: 5px;
      font-size: 12px;
    }

    .stat-number {
      font-size: 20px;
      font-weight: bold;
    }

    .updated {
      margin-top: 15px;
      color: #666;
      font-size: 11px;
      text-align: center;
    }

    .section-title {
      margin: 0 0 12px;
      padding-left: 8px;
      border-left: 5px solid #d40000;
      font-size: 17px;
    }

    .notice {
      font-size: 12px;
      line-height: 1.8;
    }

    .record {
      padding: 12px 0;
      border-bottom: 1px solid #ddd;
    }

    .record:last-child {
      border-bottom: none;
    }

    .record-date {
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 6px;
    }

    .record-number {
      font-size: 18px;
      font-weight: bold;
      color: #d40000;
    }

    .record-stats {
      margin-top: 5px;
      color: #555;
      font-size: 11px;
      line-height: 1.7;
    }

    .no-record {
      color: #777;
      font-size: 12px;
      line-height: 1.8;
    }

    footer {
      padding: 20px;
      color: #666;
      font-size: 11px;
      text-align: center;
    }

    @media (max-width: 480px) {
      header h1 {
        font-size: 20px;
      }

      .main-count .number {
        font-size: 32px;
      }
    }
  </style>
</head>

<body>

<header>
  <h1>TikTok Tracker</h1>
  <p>再生数・反応数 定点記録</p>
</header>

<main>

  <section class="card">

    <div class="video-title">
      この中にも鬼がいる...!? 👹<br>
      川﨑皇輝 / 内村颯太 / 元木湧 / 北川拓実 / 安嶋秀生 / 松尾龍
    </div>

    <div class="main-count">
      <span class="label">再生数</span>
      <span class="number" id="views">---</span>
      <div class="difference" id="viewsDiff">
        前回21:00比：---
      </div>
    </div>

    <div class="stats">

      <div class="stat">
        <span class="stat-label">いいね</span>
        <span class="stat-number" id="likes">---</span>
      </div>

      <div class="stat">
        <span class="stat-label">コメント</span>
        <span class="stat-number" id="comments">---</span>
      </div>

      <div class="stat">
        <span class="stat-label">シェア</span>
        <span class="stat-number" id="shares">---</span>
      </div>

      <div class="stat">
        <span class="stat-label">保存</span>
        <span class="stat-number" id="saves">---</span>
      </div>

    </div>

    <div class="updated" id="updated">
      データ取得中...
    </div>

  </section>


  <section class="card">

    <h2 class="section-title">
      21:00 定点記録
    </h2>

    <div id="history">
      <div class="no-record">
        記録を読み込んでいます...
      </div>
    </div>

  </section>


  <section class="card">

    <h2 class="section-title">
      過去動画との比較
    </h2>

    <div class="notice">
      記録した動画のデータを使って、過去動画との再生数推移を比較できるようにする予定です。
    </div>

  </section>

</main>

<footer>
  非公式ファンサイト<br>
  作成者：@mtkwk_info1126
</footer>


<script>
  const formatNumber = (number) => {
    return Number(number || 0).toLocaleString("ja-JP");
  };


  const formatDifference = (number) => {
    const value = Number(number || 0);

    if (value > 0) {
      return "+" + formatNumber(value);
    }

    if (value < 0) {
      return "−" + formatNumber(Math.abs(value));
    }

    return "±0";
  };


  const formatDateTime = (dateString) => {
    if (!dateString) {
      return "---";
    }

    return new Date(dateString).toLocaleString("ja-JP", {
      timeZone: "Asia/Tokyo",
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "2-digit",
      minute: "2-digit"
    });
  };


  async function loadTikTokData() {

    try {

      const [currentResponse, historyResponse] = await Promise.all([
        fetch("/api/tiktok"),
        fetch("/api/records")
      ]);


      if (!currentResponse.ok) {
        throw new Error("現在データの取得に失敗しました");
      }

      if (!historyResponse.ok) {
        throw new Error("履歴データの取得に失敗しました");
      }


      const currentData = await currentResponse.json();
      const historyData = await historyResponse.json();


      // 現在の最新データ
      document.getElementById("views").textContent =
        formatNumber(currentData.views);

      document.getElementById("likes").textContent =
        formatNumber(currentData.likes);

      document.getElementById("comments").textContent =
        formatNumber(currentData.comments);

      document.getElementById("shares").textContent =
        formatNumber(currentData.shares);

      document.getElementById("saves").textContent =
        formatNumber(currentData.saves);


      // 履歴
      const records = Array.isArray(historyData.data)
        ? historyData.data
        : [];


      const historyElement = document.getElementById("history");


      if (records.length === 0) {

        historyElement.innerHTML = `
          <div class="no-record">
            まだ21:00の記録がありません。
          </div>
        `;

      } else {

        historyElement.innerHTML = records.map((record) => {

          return `
            <div class="record">

              <div class="record-date">
                ${record.snapshot_date} 21:00
              </div>

              <div class="record-number">
                ${formatNumber(record.views)} 回
              </div>

              <div class="record-stats">
                いいね ${formatNumber(record.likes)}　
                コメント ${formatNumber(record.comments)}<br>
                シェア ${formatNumber(record.shares)}　
                保存 ${formatNumber(record.saves)}
              </div>

            </div>
          `;

        }).join("");

      }


      // 前回の21:00記録との差
      if (records.length >= 2) {

        const latestRecord = records[0];
        const previousRecord = records[1];

        const difference =
          Number(latestRecord.views) -
          Number(previousRecord.views);

        document.getElementById("viewsDiff").textContent =
          "前回21:00比：" + formatDifference(difference);

      } else {

        document.getElementById("viewsDiff").textContent =
          "前回21:00比：記録開始前";

      }


      document.getElementById("updated").textContent =
        "現在の最新データ取得：" +
        formatDateTime(currentData.fetched_at);


    } catch (error) {

      console.error(error);

      document.getElementById("updated").textContent =
        "データを取得できませんでした";

      document.getElementById("history").innerHTML = `
        <div class="no-record">
          履歴データを取得できませんでした。
        </div>
      `;

    }

  }


  loadTikTokData();
</script>

</body>
</html>
